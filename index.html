<!doctype html>
<html lang="ja" class="auth-pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17352d">
  <meta name="description" content="財務・税務・法務の学習状況と回答履歴">
  <title>きんざい学習室｜学習履歴</title>
  <style>html.auth-pending body{visibility:hidden}</style>
  <link rel="stylesheet" href="docs/styles.css">
  <script src="docs/auth.js" defer></script>
</head>
<body>
  <header class="site-header"><div class="header-inner">
    <a class="brand" href="index.html" aria-label="きんざい学習室 トップ"><img class="brand-icon" src="docs/assets/finance-icon.png" alt=""><span><strong>きんざい学習室</strong><small>一問ずつ、着実に。</small></span></a>
    <a class="header-cta" href="quiz.html">問題を解く</a>
  </div></header>
  <main class="page-shell dashboard">
    <nav class="dashboard-tabs" aria-label="履歴表示の切り替え">
      <button id="learning-tab" class="dashboard-tab active" type="button" aria-selected="true" aria-controls="learning-panel">学習記録</button>
      <button id="answered-tab" class="dashboard-tab" type="button" aria-selected="false" aria-controls="answered-panel">解答済み履歴</button>
    </nav>
    <section id="learning-panel" class="dashboard-panel" aria-labelledby="learning-tab">
      <div id="subject-overview" class="subject-overview" aria-label="科目別の学習状況"></div>
      <details class="later-section">
        <summary><span>あとで確認</span><span><strong id="later-count">0</strong>問 <i aria-hidden="true">⌄</i></span></summary>
        <div id="later-list" class="later-list"></div>
        <div id="later-empty" class="later-empty" hidden>「あとで確認」に登録した問題はありません。</div>
      </details>
    </section>
    <section id="answered-panel" class="history-section dashboard-panel" aria-labelledby="history-title" hidden>
      <div class="section-heading"><div><p class="dashboard-kicker">RECENT ACTIVITY</p><h2 id="history-title">解答した問題</h2></div><button id="open-filter" class="filter-button" type="button" aria-haspopup="dialog"><span class="filter-icon" aria-hidden="true"><i></i><i></i><i></i></span>絞り込み<span id="filter-badge" class="filter-badge" hidden></span></button></div>
      <div id="history-list" class="history-list"></div>
      <div id="history-empty" class="history-empty" hidden><span>○</span><h3>まだ回答履歴がありません</h3><p>問題に回答すると、ここに学習履歴が表示されます。</p><a class="primary-button" href="quiz.html">最初の問題を解く</a></div>
    </section>
  </main>
  <dialog id="filter-dialog" class="filter-dialog" aria-labelledby="filter-title">
    <form id="filter-form" method="dialog">
      <div class="dialog-heading"><div><p class="dashboard-kicker">FILTER</p><h2 id="filter-title">履歴を絞り込む</h2></div><button id="close-filter" class="dialog-close" type="button" aria-label="閉じる">×</button></div>
      <label class="dialog-field">科目<select id="history-subject"><option value="all">すべて</option><option value="財務">財務</option><option value="税務">税務</option><option value="法務">法務</option></select></label>
      <label class="dialog-field">状態<select id="history-result"><option value="all">すべて</option><option value="ever-wrong">一度でも不正解</option><option value="still-wrong">現在も不正解</option></select></label>
      <button class="primary-button dialog-apply" type="submit">この条件で表示</button>
    </form>
  </dialog>
  <script src="docs/questions.js"></script><script src="docs/history.js"></script>
</body>
</html>
