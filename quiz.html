<!doctype html>
<html lang="ja" class="auth-pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17352d">
  <meta name="description" content="財務・税務・法務を一問一答で学べる問題演習サイト">
  <title>きんざい学習室</title>
  <style>html.auth-pending body{visibility:hidden}</style>
  <link rel="stylesheet" href="docs/styles.css">
  <script src="docs/auth.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="トップページに戻る">
        <img class="brand-icon" src="docs/assets/finance-icon.png" alt="">
        <span><strong>きんざい学習室</strong><small>一問ずつ、着実に。</small></span>
      </a>
      <nav class="subjects" aria-label="科目を選択">
        <button class="subject active" data-subject="財務">財務</button>
        <button class="subject" data-subject="税務">税務</button>
        <button class="subject" data-subject="法務">法務</button>
      </nav>
    </div>
  </header>

  <main class="page-shell">
    <section class="study-header" aria-label="学習状況">
      <div class="summary" aria-label="学習状況">
        <a class="summary-stat" href="index.html?later=open" aria-label="あとで確認リストを開く"><strong id="answered-count">0</strong><span>あとで確認</span></a>
        <div><strong id="accuracy">—</strong><span>正答率</span></div>
        <a class="summary-stat summary-stat-last" href="index.html?tab=answered&amp;result=still-wrong" aria-label="現在も不正解の問題をすべて表示"><strong id="wrong-count">0</strong><span>復習待ち</span></a>
      </div>
    </section>

    <section class="toolbar" aria-label="出題設定">
      <fieldset>
        <legend class="visually-hidden">出題形式</legend>
        <div class="segmented">
          <button class="format active" data-format="all" aria-pressed="true">すべて</button>
          <button class="format" data-format="2" aria-pressed="false">2択</button>
          <button class="format" data-format="4" aria-pressed="false">4択</button>
        </div>
        <select id="format-select" class="format-select" aria-label="出題形式を選択">
          <option value="all" selected>すべて</option>
          <option value="2">2択</option>
          <option value="4">4択</option>
        </select>
      </fieldset>
      <div class="mode-actions">
        <button id="normal-mode" class="mode active" aria-pressed="true"><span>すべて</span><small id="all-total">0問</small></button>
        <button id="review-mode" class="mode" aria-pressed="false"><span>間違いだけ</span><small id="review-total">0問</small></button>
      </div>
    </section>

    <section id="quiz" class="quiz-card" aria-live="polite">
      <div class="quiz-topline">
        <div class="tags"><span id="type-tag" class="tag">○×問題</span><span id="format-tag" class="tag subtle">2択</span></div>
        <span id="progress-text">1 / 1</span>
      </div>
      <div class="progress-track" aria-hidden="true"><span id="progress-bar"></span></div>
      <div class="question-wrap">
        <div class="question-heading-row"><p id="question-number" class="question-number">QUESTION 01</p><button id="check-later" class="check-later" type="button" aria-pressed="false">あとで確認</button></div>
        <h2 id="question-text"></h2>
        <div id="choices" class="choices" role="group" aria-label="選択肢"></div>
      </div>
      <div id="feedback" class="feedback" hidden>
        <div class="result-row"><p id="result-label" class="result-label"></p><span id="streak-tag" class="streak-tag" hidden></span></div>
        <p id="correct-answer" class="correct-answer"></p>
        <div class="explanation"><span>解説</span><p id="explanation-text"></p></div>
      </div>
      <div class="quiz-footer">
        <div class="footer-left">
          <button id="previous-button" class="secondary-button">前の問題へ</button>
          <button id="copy-question" class="copy-button" type="button" hidden>この問題をコピー</button>
          <button id="open-chatgpt" class="chatgpt-button" type="button" hidden>コピーしてChatGPTへ移動</button>
          <button id="shuffle-button" class="text-button">↻ 順番をシャッフル</button>
        </div>
        <button id="next-button" class="primary-button" hidden>次の問題へ</button>
      </div>
    </section>

    <section id="empty-state" class="empty-state" hidden>
      <span class="empty-icon">✓</span>
      <h2>該当する問題はありません</h2>
      <p id="empty-message"></p>
      <button id="back-all" class="primary-button">すべての問題に戻る</button>
    </section>

    <footer class="page-footer">
      <p>回答履歴はこの端末のブラウザ内だけに保存されます。</p>
      <button id="reset-history" class="text-button danger">学習履歴をリセット</button>
    </footer>
  </main>
  <script src="docs/questions.js"></script>
  <script src="docs/app.js"></script>
</body>
</html>
